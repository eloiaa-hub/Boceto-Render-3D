<head>

<style>
:root{--bg-app:#eef1f5;--bg-panel:#f8f9fa;--border-color:#d1d5db;--text-main:#333;--text-muted:#888;--accent:#005A9C;--accent-light:#e8f0f8;--canvas-bg:#fff;--draw-stroke:#000;--shadow:0 2px 8px rgba(0,0,0,.12)}
body.dark-mode{--bg-app:#1a1a1e;--bg-panel:#252528;--border-color:#3a3a3f;--text-main:#e8e8ec;--text-muted:#777;--accent-light:#1a2a3a;--canvas-bg:#1e1e22;--draw-stroke:#f0f0f0;--shadow:0 2px 8px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Geneva,Verdana,sans-serif}
body{background:var(--bg-app);color:var(--text-main);height:100vh;overflow:hidden;display:flex;align-items:stretch;justify-content:center;padding:10px}
.app-window{background:var(--bg-panel);width:100%;max-width:1900px;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border-color);position:relative}
.top-bar{padding:10px 18px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;user-select:none;gap:10px}
.top-bar-title{font-weight:700;font-size:14px;white-space:nowrap}.vers{font-size:10px;font-weight:700;background:var(--accent-light);color:var(--accent);border-radius:8px;padding:1px 7px;margin-left:7px}
.top-bar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.project-name{background:var(--bg-app);border:1px solid var(--border-color);border-radius:4px;padding:4px 8px;font-size:12px;color:var(--text-main);width:150px;outline:none}
.btn-manual{background:var(--bg-panel);border:1px solid var(--accent);color:var(--accent);padding:4px 10px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;text-decoration:none}.btn-manual:hover{background:var(--accent-light)}
.icon-gear{cursor:pointer;font-size:18px}
.status-bar{font-size:11px;color:var(--text-muted);padding:4px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-color);background:var(--bg-app)}
.status-pill{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 9px;border-radius:9px;white-space:nowrap}
.status-hint{font-size:10.5px;font-style:italic;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-snap{font-size:10.5px;color:var(--accent);font-weight:700;min-width:90px;text-align:right}.status-coords{font-family:Consolas,monospace;font-size:11px;color:var(--text-main);white-space:nowrap;min-width:150px;text-align:right}
.settings-panel{display:none;padding:12px 18px;gap:40px;border-bottom:1px solid var(--border-color)}.settings-panel.visible{display:flex}.settings-panel h4{font-size:11px;margin-bottom:6px}.setting-row{display:flex;gap:12px;font-size:12px;align-items:center}.color-palette{display:flex;gap:6px}.color-btn{width:20px;height:20px;border-radius:50%;cursor:pointer}
.workspace{display:flex;flex:1;padding:12px;gap:12px;overflow:hidden;min-height:0}
.tool-strip{background:var(--bg-panel);border:1px solid var(--border-color);border-radius:6px;display:grid;grid-template-columns:repeat(2,32px);gap:2px;padding:8px 6px;align-content:start;overflow-y:auto;flex-shrink:0}
.tool-divider{grid-column:1/-1;height:1px;background:var(--border-color);margin:3px 2px}
.tool-btn{width:32px;height:29px;display:flex;align-items:center;justify-content:center;border-radius:5px;cursor:pointer;color:var(--text-main);border:1px solid transparent;font-size:10px;font-weight:700}.tool-btn svg{width:18px;height:18px}.tool-btn:hover{background:var(--accent-light);color:var(--accent)}.tool-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.canvas-container{flex:1;min-width:300px;display:flex;flex-direction:column;gap:6px;min-height:0}
#lienzoCaja{position:relative;flex:1;min-height:0;border:1px solid var(--border-color);border-radius:6px;overflow:hidden;background:var(--canvas-bg)}
#lienzo,#over{position:absolute;left:0;top:0}#over{cursor:crosshair;outline:none}
#opts{position:absolute;left:10px;top:10px;display:none;gap:12px;align-items:center;background:var(--bg-panel);border:1px solid var(--border-color);border-radius:6px;padding:5px 10px;font-size:11.5px;box-shadow:var(--shadow);color:var(--text-muted)}#opts input[type=number]{width:62px;padding:2px 4px;border:1px solid var(--border-color);border-radius:3px;background:var(--bg-app);color:var(--text-main)}#opts select{padding:2px;border:1px solid var(--border-color);border-radius:3px;background:var(--bg-app);color:var(--text-main)}#opts label{display:flex;gap:5px;align-items:center}
#dyn{position:absolute;display:none;width:120px;font:12px Consolas,monospace;padding:3px 6px;border:1px solid var(--accent);border-radius:4px;background:var(--bg-panel);color:var(--text-main);outline:none;z-index:5}
#lect{position:absolute;display:none;font:11px Consolas,monospace;background:var(--accent);color:#fff;padding:1px 6px;border-radius:3px;pointer-events:none;white-space:nowrap;z-index:4}
.vista-bot{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}.mini{background:var(--bg-panel);border:1px solid var(--border-color);color:var(--text-main);border-radius:4px;padding:3px 8px;font-size:11.5px;cursor:pointer}.mini:hover{background:var(--accent-light)}
#snack{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:#333;color:#fff;padding:7px 14px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80%}#snack.v{opacity:.95}
.modos{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.modo{background:var(--bg-panel);border:1px solid var(--border-color);color:var(--text-muted);border-radius:4px;padding:3px 9px;font-size:11px;cursor:pointer;font-weight:600}.modo.on{background:var(--accent);border-color:var(--accent);color:#fff}.modos select{font-size:11px;padding:2px;border:1px solid var(--border-color);border-radius:3px;background:var(--bg-panel);color:var(--text-main)}.st{font-size:10.5px;color:var(--text-muted);margin-left:8px}
.right-panel{width:250px;flex-shrink:0;background:var(--bg-panel);border:1px solid var(--border-color);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.right-panel h3{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);font-weight:700}.ph{display:flex;justify-content:space-between;align-items:center}
#capas{display:flex;flex-direction:column;gap:1px;max-height:210px;overflow-y:auto;border:1px solid var(--border-color);border-radius:4px;padding:2px;background:var(--bg-app)}
.capa{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 4px;border-radius:3px;cursor:pointer;user-select:none}.capa:hover{background:var(--accent-light)}.capa.act{background:var(--accent);color:#fff}.cv,.cb{font-size:10px}.swatch{width:11px;height:11px;border-radius:2px;border:1px solid var(--border-color)}.cn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbox{display:flex;flex-direction:column;gap:5px;background:var(--bg-app);border:1px solid var(--border-color);border-radius:5px;padding:8px}
.nota{font-size:11px;color:var(--text-muted);line-height:1.45}
.param-line{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted)}.param-line input[type=number],.param-line select,.param-line input[type=text]{width:118px;background:var(--bg-panel);color:var(--text-main);border:1px solid var(--border-color);border-radius:3px;padding:2px 5px;font-size:11.5px;text-align:right}.param-line select{text-align:left}.param-line input[type=range]{width:110px;accent-color:var(--accent)}.param-line input[type=checkbox]{accent-color:var(--accent)}
.btn-row{display:flex;gap:6px}.btn-row>*{flex:1}button.btn-action{background:var(--accent);color:#fff;border:none;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:11.5px;font-weight:600}button.btn-action.sec{background:var(--bg-panel);color:var(--text-main);border:1px solid var(--border-color);font-weight:500}button.btn-action.sec:hover{background:var(--bg-app)}
details summary{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);font-weight:700;cursor:pointer}.imanes{display:grid;grid-template-columns:1fr 1fr;gap:3px;font-size:11px;margin-top:5px}.imanes label{display:flex;gap:4px;align-items:center}.imanes input{accent-color:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:700;display:none;align-items:center;justify-content:center;padding:24px}.modal-overlay.visible{display:flex}.modal{background:var(--bg-panel);border:1px solid var(--border-color);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:100%;max-width:420px;padding:18px;display:flex;flex-direction:column;gap:10px}.mhead{display:flex;justify-content:space-between;align-items:center}.mhead h2{font-size:15px}#mX{cursor:pointer}#mBody{display:flex;flex-direction:column;gap:8px}.modal p{font-size:12.5px;line-height:1.55}.modal code{font-family:Consolas,monospace;background:var(--bg-app);padding:0 3px}.modal .param-line{font-size:12.5px}#mFoot{justify-content:flex-end;margin-top:6px}#mFoot>*{flex:0 1 auto;padding:6px 14px}
.sep{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-top:5px;border-top:1px solid var(--border-color);padding-top:5px}.tb{border-collapse:collapse;width:100%;font-size:12px}.tb th,.tb td{border:1px solid var(--border-color);padding:3px 6px;text-align:left}.tb th{background:var(--bg-app);position:sticky;top:0}.tb.ed input[type=text],.tb.ed select{width:100%;background:var(--bg-panel);color:var(--text-main);border:1px solid var(--border-color);border-radius:3px;padding:2px 4px;font-size:12px}
.right-panel>*{flex-shrink:0}
.bool{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#ctx{position:fixed;display:none;z-index:800;background:var(--bg-panel);border:1px solid var(--border-color);border-radius:7px;box-shadow:0 8px 26px rgba(0,0,0,.28);padding:4px;min-width:205px;font-size:12.5px;user-select:none}.ctx-i{display:flex;justify-content:space-between;gap:24px;padding:5px 10px;border-radius:4px;cursor:pointer}.ctx-i:hover{background:var(--accent);color:#fff}.ctx-i small{color:var(--text-muted);font-size:11px}.ctx-i:hover small{color:#fff}.ctx-sep{height:1px;background:var(--border-color);margin:3px 4px}
#simp{display:none;position:absolute;right:10px;top:10px;width:262px;background:var(--bg-panel);border:1px solid var(--border-color);border-radius:7px;box-shadow:var(--shadow);padding:10px 12px;z-index:6}#simp h4{font-size:13px;margin-bottom:8px}#simp input[type=range]{width:100%;accent-color:var(--accent);margin:5px 0}#simp .param-line{margin:5px 0}#simp .param-line input[type=text]{width:70px}#simp .nota{margin:8px 0}#simp button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>

 if(e.t==='arc'){const c={k:'A',c:e.c,r:e.r,a0:e.a0,sw:sweepOf(e),s0:0,s1:1},fin=dist(q,polar(e.c,e.r,e.a1))<dist(q,polar(e.c,e.r,e.a0));others().forEach(x=>prims(x).forEach(p=>interP(c,p,false,true).forEach(i=>{const t=angv(sub(i.p,e.c)),ext=fin?normA(t-e.a1):normA(e.a0-t);if(ext>1e-9&&ext<TAU-c.sw&&(!best||ext<best.ext))best={ext,t}})));if(!best)return false;guardarU();if(fin)e.a1=best.t;else e.a0=best.t;touch(e);return true}

// Estirar
function dentroW(p,w){return typeof w==='function'?w(p):p.x>=w.x0&&p.x<=w.x1&&p.y>=w.y0&&p.y<=w.y1}
function tocaVentana(e,w){return vertices(e).some(k=>dentroW(k.p,w))}
function vertices(e){switch(e.t){case'line':return[{p:e.a,s:'a'},{p:e.b,s:'b'}];case'arc':return[{p:polar(e.c,e.r,e.a0)},{p:polar(e.c,e.r,e.a1)},{p:e.c}];case'poly':return e.pts.map(p=>({p}));case'spline':return (e.per||e.ctrl).map(p=>({p}));case'circle':case'ellipse':return[{p:e.c}];case'text':case'marco':case'lista':return[{p:e.p}];case'corte':return[{p:e.a},{p:e.b}];case'dim':return['a','b','pos','c','p1','p2'].filter(k=>e[k]).map(k=>({p:e[k],s:k}));case'hatch':return e.loops.flatMap(l=>l.pts.map(p=>({p})));default:return[]}}
function estirarEnt(e,w,d){const mv=p=>dentroW(p,w)?add(p,d):p;touch(e);switch(e.t){
 case'line':e.a=mv(e.a);e.b=mv(e.b);break;
 case'poly':e.pts=e.pts.map(mv);break;
 case'spline':if(e.per){e.per=e.per.map(mv);spRegen(e)}else e.ctrl=e.ctrl.map(mv);break;
 case'arc':{const A=polar(e.c,e.r,e.a0),B=polar(e.c,e.r,e.a1),Mi=polar(e.c,e.r,e.a0+sweepOf(e)/2);const ia=dentroW(A,w),ib=dentroW(B,w);if(ia&&ib&&dentroW(e.c,w)){e.c=add(e.c,d);break}if(ia||ib){const r=arc3(mv(A),add(Mi,mul(d,.5*(ia&&ib?2:1))),mv(B));if(r)Object.assign(e,r)}break}
 case'circle':case'ellipse':if(dentroW(e.c,w))e.c=add(e.c,d);break;
 case'corte':e.a=mv(e.a);e.b=mv(e.b);break;case'text':case'marco':case'lista':if(dentroW(e.p,w))e.p=add(e.p,d);break;
 case'dim':['a','b','pos','c','p1','p2'].forEach(k=>{if(e[k])e[k]=mv(e[k])});break;
 case'hatch':if(e.loops.every(l=>l.pts.every(p=>dentroW(p,w))))e.loops.forEach(l=>l.pts=l.pts.map(p=>add(p,d)));break}touch(e)}
// Pinzamientos
function pinzas(e){const o=[],A=(p,id,tipo)=>o.push({p,id,tipo});switch(e.t){
 case'line':A(e.a,'a');A(e.b,'b');A(lerp(e.a,e.b,.5),'m',1);break;
 case'circle':A(e.c,'c');[0,1,2,3].forEach(i=>A(polar(e.c,e.r,i*Math.PI/2),'r'));break;
 case'arc':A(e.c,'c');A(polar(e.c,e.r,e.a0),'a0');A(polar(e.c,e.r,e.a1),'a1');A(polar(e.c,e.r,e.a0+sweepOf(e)/2),'mid');break;
 case'poly':e.pts.forEach((p,i)=>A(p,'v'+i));prims(e).forEach((p,i)=>A(primPt(p,.5),'s'+i,1));break;
 case'ellipse':A(e.c,'c');A(add(e.c,e.m),'M');A(elPt(e,Math.PI/2),'R');if(elSweep(e)<TAU-1e-9){A(elPt(e,e.t0),'t0');A(elPt(e,e.t1),'t1')}break;
 case'spline':(e.per||e.ctrl).forEach((p,i)=>A(p,'c'+i));break;
 case'text':A(e.p,'p');break;case'corte':A(e.a,'a');A(e.b,'b');break;case'marco':case'lista':A(e.p,'p');break;
 case'xline':A(e.p,'p');break;
 case'dim':if(e.a){A(e.a,'a');A(e.b,'b')}if(e.c)A(e.c,'c');if(e.p1){A(e.p1,'p1');A(e.p2,'p2')}A(e.pos,'pos');break}return o}
function mueveP(e,id,q){touch(e);const h=id[0];switch(e.t){
 case'line':if(id==='m'){const d=sub(q,lerp(e.a,e.b,.5));e.a=add(e.a,d);e.b=add(e.b,d)}else e[id]=q;break;
 case'circle':if(id==='c')e.c=q;else e.r=Math.max(dist(e.c,q),1e-6);break;
 case'arc':if(id==='c')e.c=q;else if(id==='mid'){const r=arc3(polar(e.c,e.r,e.a0),q,polar(e.c,e.r,e.a1));if(r)Object.assign(e,r)}else{const t=angv(sub(q,e.c));e[id]=t}break;
 case'poly':{const i=+id.slice(1);if(h==='v')e.pts[i]=q;else{const n=e.pts.length,a=e.pts[i],b=e.pts[(i+1)%n];if(e.b[i]){const r=arc3(a,q,b);if(r){const u=cross(sub(q,a),sub(b,a))>0?-1:1,sw=normA(r.a1-r.a0)||TAU;e.b[i]=Math.tan(sw/4)*(cross(sub(q,a),sub(b,q))>0?-1:1)*(-1)*-1;e.b[i]=(cross(sub(b,a),sub(q,a))<0?1:-1)*Math.abs(Math.tan(sw/4))}}else{const d=sub(q,lerp(a,b,.5));e.pts[i]=add(a,d);e.pts[(i+1)%n]=add(b,d)}}break}
 case'ellipse':if(id==='c')e.c=q;else if(id==='M'){const old=len(e.m)*e.ratio;e.m=sub(q,e.c);e.ratio=Math.max(1e-3,Math.min(1,old/(len(e.m)||1)))}else if(id==='R'){e.ratio=Math.max(1e-3,Math.min(1,Math.abs(cross(norm(e.m),sub(q,e.c)))/len(e.m)))}else{const lo=rotv(sub(q,e.c),-angv(e.m));e[id]=Math.atan2(lo.y/e.ratio,lo.x)}break;
 case'spline':if(e.per){e.per[+id.slice(1)]=q;spRegen(e)}else e.ctrl[+id.slice(1)]=q;break;
 case'text':case'marco':case'lista':case'xline':e.p=q;break;case'corte':e[id]=q;break;
 case'dim':e[id]=q;if(e.k==='rad'||e.k==='dia'){}break}touch(e)}

function matPorId(n){return D.materiales.find(m=>m.n===n)||D.materiales[0]}
function asegurarRotulos(){if(!D.capas.some(c=>c.n==='ROTULOS'))D.capas.push({n:'ROTULOS',color:3,lt:'CONTINUA',lw:.18,vis:true,bloq:false})}
const sigMarca=()=>D.ents.reduce((m,e)=>e.pieza?Math.max(m,e.pieza.marca||0):m,0)+1;
function pExt(e){const p=e.pieza,F_=flatLoop({pts:e.pts,b:e.b});let t;if(p.veta!=null)t=p.veta*Math.PI/180;else{let b=null;prims(e).forEach(q=>{const l=primLen(q);if(q.k==='L'&&(!b||l>b.l))b={l,t:angv(sub(q.b,q.a))}});t=b?b.t:0}
 const u=V(Math.cos(t),Math.sin(t)),n=perp(u),a=F_.map(q=>dot(q,u)),c=F_.map(q=>dot(q,n)),a0=Math.min(...a),a1=Math.max(...a),c0=Math.min(...c),c1=Math.max(...c);let L=a1-a0,A=c1-c0;const cen=add(mul(u,(a0+a1)/2),mul(n,(c0+c1)/2));if(p.veta==null&&A>L){const x=L;L=A;A=x;return{L,A,u:n,n:perp(n),cen}}return{L,A,u,n,cen}}

function anotPieza(e){const R={prims:[],tris:[],texts:[]},p=e.pieza,k=D.esc||1;if(!D.verRot&&D.verRot!==undefined)return R;const X=pExt(e),ar=polyArea(e.pts,e.b),sg=ar>=0?1:-1,off=1.5*k;
 prims(e).forEach((q,i)=>{if(!((p.cantos||[])[i]>0))return;if(q.k==='L'){const u=norm(sub(q.b,q.a)),n=mul(perp(u),sg*off),l=dist(q.a,q.b);if(l<=off*2)return;R.prims.push(L_(add(add(q.a,n),mul(u,off)),add(sub(q.b,mul(u,off)),n)))}else{const r=q.r-Math.sign(q.sw)*sg*off;if(r>0)R.prims.push({k:'A',c:q.c,r,a0:q.a0,sw:q.sw,s0:0,s1:1})}});
 if(p.rot===false)return R;const h=2.5*k,rot=upright(angv(X.u)),nt=V(-Math.sin(rot),Math.cos(rot)),t1=(p.marca||'')+'. '+(p.nombre||''),t2=fmt(X.L,1)+' × '+fmt(X.A,1)+' × '+fmt(p.gros,1),w=Math.max(t1.length,t2.length)*h*.62;
 if(w<X.L*.92&&h*3<X.A){R.texts.push({p:add(X.cen,mul(nt,h*.35)),h,rot,s:t1,al:'c'},{p:add(X.cen,mul(nt,-h*1.15)),h,rot,s:t2,al:'c'});if(p.veta!=null&&h*7<X.A){const d=V(Math.cos(p.veta*Math.PI/180),Math.sin(p.veta*Math.PI/180)),c=add(X.cen,mul(nt,-h*3)),l=Math.min(16*k,X.L*.25),a=sub(c,mul(d,l)),b=add(c,mul(d,l));R.prims.push(L_(a,b));flecha(R,a,mul(d,-1),2.5*k);flecha(R,b,d,2.5*k)}}
 else if(h*1.3<X.A&&h*2<X.L&&p.marca!=null)R.texts.push({p:add(X.cen,mul(nt,-h/2)),h,rot,s:String(p.marca),al:'c'});return R}
function hatchDe(e){const p=e.pieza,m=matPorId(p.mat);return{t:'hatch',capa:D.capas.some(c=>c.n==='SOMBREADO')?'SOMBREADO':e.capa,pat:m.pat,sc:D.esc||1,rot:p.veta!=null?p.veta:pExtAng(e),loops:[{pts:e.pts,b:e.b}].concat(huecosDe(e).map(h=>({pts:h.pts,b:h.b})))}}

function hacerPieza(e,op){op=op||{};const m=matPorId(op.mat||OPT.matP),g=op.gros||OPT.grosP||m.gros[0];let veta=op.veta;if(veta===undefined){if(!m.veta)veta=null;else{let b=null;polyPrims(e.pts,e.b,true).forEach(q=>{const l=primLen(q);if(q.k==='L'&&(!b||l>b.l))b={l,t:angv(sub(q.b,q.a))}});veta=b?Math.round(normA(b.t)*180/Math.PI*1e3)/1e3%180:0}}const marca=op.marca||sigMarca();e.pieza={marca,nombre:op.nombre||('Pieza '+marca),mat:m.n,gros:g,veta,cant:1,cantos:e.pts.map(()=>0),sec:!!op.sec,despiece:op.despiece!==false};asegurarRotulos();return e}

function dlgPDF(){const ms=D.ents.filter(e=>e.t==='marco').length;dlg('PDF a escala',`<p>${ms?ms+' lámina(s): una página por cada una.':'No has colocado ninguna lámina: se ajustará todo a un A3 con la mejor escala normalizada. Para elegir formato y escala, usa la herramienta Lámina.'}</p><div class="param-line">Todo en negro <input type="checkbox" id="pdN" checked></div>`,[{t:'Cancelar'},{t:'Generar PDF',p:1,f(){const pg=paginasPDF();if(!pg.length){avisar('No hay nada que imprimir');return false}descargar(pdfDe(pg,{negro:$('pdN').checked}),nombreP()+'.pdf','application/pdf');avisar('PDF generado')}}])}
function dlgRevisar(){const tol=.5;const r=revisar(tol);REV=[].concat(r.huecos.map(h=>({p:h.a.p,c:'#e67e22'})),r.abiertos.map(p=>({p,c:'#dc3545'})));redO();dlg('Revisar geometría',`<p>Duplicados: <b>${r.dup.length}</b><br>Entidades de longitud nula: <b>${r.nul.length}</b><br>Huecos pequeños (hasta 0,5 mm), en naranja: <b>${r.huecos.length}</b><br>Extremos abiertos, en rojo: <b>${r.abiertos.length}</b></p><p class="nota">Reparar elimina duplicados y nulos y cierra los huecos moviendo los extremos de líneas y polilíneas.</p>`,[{t:'Cerrar',f(){REV=[];redO()}},{t:'Reparar',p:1,f(){guardarU();const q=new Set(r.dup.concat(r.nul));D.ents=D.ents.filter(e=>!q.has(e));const n=repararHuecos(r.huecos);trasDoc();REV=[];redO();avisar(q.size+' eliminadas · '+n+' huecos cerrados')}}])}
function dlgEstilo(){const d=D.dim;dlg('Cotas y escala de anotación',`<div class="param-line">Escala del dibujo (texto y cotas) 1:<input type="number" id="eE" value="${D.esc||1}" min="0.01" step="any"></div><div class="param-line">Altura de texto (mm en papel)<input type="number" step="any" id="eH" value="${d.h}"></div><div class="param-line">Longitud de flecha<input type="number" step="any" id="eF" value="${d.fl}"></div><div class="param-line">Decimales<select id="eD">${[0,1,2,3].map(x=>`<option ${d.dec===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="param-line">Escala de tipos de línea<input type="number" step="any" id="eL" value="${D.ltsc||1}"></div>`,[{t:'Cancelar'},{t:'Aceptar',p:1,f(){guardarU();const ne=+$('eE').value||1;D.ents.forEach(e=>{if((e.t==='dim'||e.t==='corte')&&(e.sc||1)===(D.esc||1)){e.sc=ne;touch(e)}});D.esc=ne;d.h=+$('eH').value||3.5;d.fl=+$('eF').value||3;d.dec=+$('eD').value;D.ltsc=+$('eL').value||1;D.ents.forEach(touch);trasDoc()}}],440)}
function setOscuro(v){document.body.classList.toggle('dark-mode',v);CFG.oscuro=v;try{localStorage.setItem('mc2d_oscuro',v?'1':'0')}catch(_){}redib()}
function setAcc(c){document.documentElement.style.setProperty('--accent',c);try{localStorage.setItem('mc2d_acc',c)}catch(_){}redib()}

 const bind=(id,f)=>$(id).onclick=f;bind('bNuevo',nuevo);bind('bAbrir',()=>{$('fA').dataset.f='';$('fA').click()});bind('bIns',()=>{$('fA').dataset.f='1';$('fA').click()});bind('bFondo',()=>$('fF').click());bind('bGuardar',guardarJSON);bind('bExp',dlgDXF);bind('bPDF',dlgPDF);bind('bRev',dlgRevisar);bind('bEst',dlgEstilo);bind('bDes',deshacer);bind('bReh',rehacer);bind('bEnc',encuadrar);bind('bMas',()=>zoomA(W/2,H/2,1.3));bind('bMen',()=>zoomA(W/2,H/2,1/1.3));bind('bCapa',nuevaCapa);bind('bAyu',ayuda);montarSimp();bind('bHer',dlgHerrajes);bind('bPla',dlgPlantilla);bind('bTal',dlgTaladros);bind('bCom',dlgComprobar);bind('bMat',dlgMateriales);bind('bDesp',dlgDespiece);
 $('fA').onchange=ev=>{const f=ev.target.files[0];if(f)leerArchivo(f,!!ev.target.dataset.f);ev.target.value=''};$('fF').onchange=ev=>{const f=ev.target.files[0];if(f)cargarFondo(f);ev.target.value=''};
 const tg=(id,f)=>$(id).onclick=()=>{f();estado();redib()};tg('orto',()=>{CFG.orto=!CFG.orto;if(CFG.orto)CFG.polar=false});tg('polar',()=>{CFG.polar=!CFG.polar;if(CFG.polar)CFG.orto=false});tg('iman',()=>CFG.imanes=!CFG.imanes);tg('rejI',()=>CFG.snapGrid=!CFG.snapGrid);tg('rejV',()=>CFG.grid=!CFG.grid);tg('rast',()=>{CFG.rastreo=!CFG.rastreo;TRACK=[]});tg('verLW',()=>CFG.verLW=!CFG.verLW);
 $('polA').onchange=ev=>CFG.polarA=+ev.target.value;$('paso').onchange=ev=>{CFG.paso=+ev.target.value;redib()};
 document.querySelectorAll('#imanes input').forEach(i=>{i.checked=CFG.snap[i.dataset.k];i.onchange=()=>CFG.snap[i.dataset.k]=i.checked});
 $('fOp').oninput=ev=>{if(F){F.op=+ev.target.value;redib()}};$('fVer').onclick=()=>{if(F){F.vis=!F.vis;redib()}};$('fQui').onclick=()=>{F=null;pintarFondo();redib()};
 $('cfg').onclick=()=>$('ajustes').classList.toggle('visible');$('osc').onchange=ev=>setOscuro(ev.target.checked);document.querySelectorAll('.color-btn').forEach(b=>b.onclick=()=>setAcc(b.dataset.c));
 document.body.insertAdjacentHTML('beforeend','<div id="ctx"></div>');$('mX').onclick=()=>{$('modal').classList.remove('visible');REV=[];redO()};
 const zona=$('lienzoCaja');zona.ondragover=ev=>ev.preventDefault();zona.ondrop=ev=>{ev.preventDefault();const f=ev.dataTransfer.files[0];if(!f)return;if(/\.(dxf|json)$/i.test(f.name))leerArchivo(f,false);else if(/\.(png|jpe?g|svg|webp)$/i.test(f.name))cargarFondo(f)};
 window.addEventListener('resize',resize);window.addEventListener('beforeunload',ev=>{autoguardarF()});
 try{if(localStorage.getItem('mc2d_oscuro')==='1'){$('osc').checked=true;document.body.classList.add('dark-mode')}const a=localStorage.getItem('mc2d_acc');if(a)document.documentElement.style.setProperty('--accent',a)}catch(_){}
 resize();view.oy=H-70;D=docPlantilla();trasDoc();pintarTools();estado();pintarOpts();setInterval(autoguardar,20000);
 let aut=null;try{aut=localStorage.getItem('mc2d_auto')}catch(_){}if(aut&&!MODO_P3D&&!DESDE_BOCETO){try{const o=JSON.parse(aut);if(o.doc&&o.doc.ents&&o.doc.ents.length)dlg('Dibujo recuperado',`<p>Hay un dibujo autoguardado («${(o.nombre||'').replace(/</g,'&lt;')}», ${o.doc.ents.length} entidades). ¿Quieres abrirlo?</p>`,[{t:'Empezar en blanco',f(){try{localStorage.removeItem('mc2d_auto')}catch(_){}}},{t:'Recuperar',p:1,f(){cargarJSON(aut)}}])}catch(_){}}}
function autoguardarF(){cambioAuto=cambioAuto&&D.ents.length>0;autoguardar()}
function ayuda(){dlg('Ayuda rápida',`<p><b>Dibujar:</b> elige herramienta, clic para situar puntos, escribe medidas junto al cursor: <code>100</code> en la dirección del ratón, <code>100&lt;45</code> longitud y ángulo, <code>@dx,dy</code> relativo, <code>x,y</code> absoluto.</p><p><b>Seleccionar:</b> ventana hacia la derecha (solo lo que queda dentro) o hacia la izquierda (todo lo que toca). Mayús añade o quita.</p><p><b>Teclas:</b> F3 imanes · F8 orto · F9 imán a rejilla · F10 polar · F11 rastreo · Intro o clic derecho: terminar · Esc: cancelar · Espacio o botón central: desplazar · rueda: zoom · F: encuadrar.</p><p><b>Rastreo:</b> deja el cursor medio segundo en un imán y aparece una cruz verde; luego alinea en horizontal o vertical con ese punto.</p><p>Las herramientas de modificar piden selección si no hay ninguna.</p>`,[{t:'Cerrar',p:1}],560)}
