<!-- MODO PIEZA 3D: inicio -->
<script>
// ════════════════════════════════════════════════════════════════════
//  ✏ MODO PIEZA 3D (calcador.html?modo=pieza3d, o data-pieza3d="1")
//  Boceto a Render 3D abre el Calcador dentro de una ventana para dibujar
//  el contorno de una pieza: solo dibujo y cotas, sin G-code ni mecanizado.
//  Se comunica con quien lo abre por mensajes:
//    ← { tipo:'pieza3d-datos', nombre, vista, ancho, alto (mm), calcador?, fondo? }
//    → { tipo:'pieza3d-listo' } · { tipo:'pieza3d-resultado', calcador } · { tipo:'pieza3d-cancelar' }
//  En el Calcador normal, el Corrector y el Láser este bloque no hace nada.
// ════════════════════════════════════════════════════════════════════
(function () {
'use strict';
const q = new URLSearchParams(location.search);
if (document.documentElement.dataset.pieza3d !== '1' && q.get('modo') !== 'pieza3d') return;
document.documentElement.dataset.pieza3d = '1';
const destino = window.parent !== window ? window.parent : window.opener;
const enviar = m => { try { destino && destino.postMessage(m, '*'); } catch (e) {} };

// Sin autoguardado ni avisos de «sin guardar»: no se pisa el trabajo del Calcador normal
try { window.guardarAuto = function () {}; window.guardarAutoPronto = function () {}; } catch (e) {}
try { if (window.SG) { SG.guardado = function () {}; SG.cambio = function () {}; } } catch (e) {}
window.addEventListener('beforeunload', e => { e.stopImmediatePropagation(); }, true);

// Interfaz: fuera lo que no sirve para dibujar una pieza
const css = document.createElement('style');
css.textContent = `
html[data-pieza3d="1"] .ir-portada, html[data-pieza3d="1"] .sim-plano, html[data-pieza3d="1"] #c2Tabs,
html[data-pieza3d="1"] #c2PaneEj, html[data-pieza3d="1"] #c2PaneCorr, html[data-pieza3d="1"] #tutorPanel,
html[data-pieza3d="1"] .right-panel, html[data-pieza3d="1"] #btnPanelDer, html[data-pieza3d="1"] .ver-suite,
html[data-pieza3d="1"] button[onclick="abrirBiblioteca()"], html[data-pieza3d="1"] a.btn-manual[href^="manual"],
html[data-pieza3d="1"] .tool-btn[data-h="texto"] { display: none !important; }
html[data-pieza3d="1"] .p3d-barra { display: flex; align-items: center; gap: 8px; margin-left: 10px; }
html[data-pieza3d="1"] .top-bar-title { white-space: nowrap; }
html[data-pieza3d="1"] .p3d-info { font-size: 12px; opacity: .8; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
html[data-pieza3d="1"] .p3d-usar { background: #1f6fd1 !important; color: #fff !important; border-color: #1f6fd1 !important; font-weight: 600; }
`;
document.head.appendChild(css);
document.documentElement.classList.add('sin-der');
const tit = document.querySelector('.top-bar-title');
if (tit) tit.firstChild && (tit.firstChild.textContent = '✏ Contorno de la pieza');
const barra = document.createElement('div'); barra.className = 'p3d-barra';
barra.innerHTML = `<span class="p3d-info" id="p3dInfo"></span>
  <button class="btn-manual" id="p3dCancelar" title="Volver al 3D sin cambiar la pieza">✕ Cancelar</button>
  <button class="btn-manual p3d-usar" id="p3dUsar" title="El contorno mayor será la pieza; los que estén dentro, sus huecos">✓ Usar en la pieza</button>`;
const der = document.querySelector('.top-bar-right'); if (der) der.prepend(barra);
document.getElementById('p3dCancelar').onclick = () => enviar({ tipo: 'pieza3d-cancelar' });
document.getElementById('p3dUsar').onclick = () => {
    const cerrados = contornos.filter(c => c.cerrado && c.pts.length >= 2);
    if (!cerrados.length) { snack('Dibuja al menos un contorno cerrado (⭘ cierra el que estás dibujando)'); return; }
    const d = exportarJSON(true); if (!d) return;
    enviar({ tipo: 'pieza3d-resultado', nombre: nombreProyecto(), calcador: d.calcador });
};
try { setTimeout(() => { redimensionar(); }, 50); } catch (e) {}

// Datos de la pieza que llegan de Boceto a Render 3D
window.addEventListener('message', e => {
    const d = e.data; if (!d || typeof d !== 'object' || d.tipo !== 'pieza3d-datos') return;
    try {
        document.getElementById('projectName').value = d.nombre || 'pieza';
        document.getElementById('p3dInfo').textContent = `${d.nombre || 'Pieza'} · ${d.vista || ''} · ${Math.round(d.ancho * 10) / 10} × ${Math.round(d.alto * 10) / 10} mm`;
        guardarUndo();
        fondo = null;
        if (d.calcador && Array.isArray(d.calcador.contornos) && d.calcador.contornos.length) {
            abrirJSONDatos({ nombre: d.nombre, calcador: d.calcador });
        } else {
            const w = +d.ancho || 100, h = +d.alto || 100;
            contornos = sanearContornos([{ pts: [{ x: 0, y: 0 }, { x: w, y: 0 }, { x: w, y: h }, { x: 0, y: h }], b: [0, 0, 0, 0], cerrado: true }]);
            cotasAjuste = {}; cotasManuales = []; sel = -1; selSet = new Set(); dib = null;
        }
        if (d.fondo && d.fondo.dataUrl) crearFondoImagen(d.fondo.dataUrl, d.fondo.nombre || 'boceto', { s: d.fondo.s, tx: d.fondo.tx, ty: d.fondo.ty, rot: 0, opac: d.fondo.opac ?? 0.5 }, null);
        else { try { actualizarPanelFondo(); } catch (e2) {} }
        refrescar(); setTimeout(() => { try { redimensionar(); encuadrar(); } catch (e3) {} }, 80);
        snack('Dibuja o retoca el contorno y pulsa «✓ Usar en la pieza»');
    } catch (err) { console.error(err); snack('No se pudieron leer los datos de la pieza'); }
});
window.addEventListener('load', () => setTimeout(() => enviar({ tipo: 'pieza3d-listo' }), 300));
})();
</script>
<!-- MODO PIEZA 3D: fin -->
